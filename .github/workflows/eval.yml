name: eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest
      - name: Run evals (mock, no API keys)
        run: |
          EVAL_MOCK=1 python evals/runner.py --threshold 0.85
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json
      - name: Check coverage (optional)
        run: |
          python -m pytest --cov=app --cov-report=term
